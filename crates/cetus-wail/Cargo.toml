[package]
name = "cetus-wail"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Cetus WebAssembly binary instrumentation crate (watchpoint insertion, function patching)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasmparser = "0.230"
wasm-encoder = { version = "0.230", features = ["wasmparser"] }
thiserror = "2"

[dev-dependencies]
wasmi = "0.40"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
