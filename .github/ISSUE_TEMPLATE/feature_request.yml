
name: Feature request
description: Suggest an improvement or new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Explain the use case.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like it to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      validations:
        required: false

  - type: dropdown
    id: component
    attributes:
      label: Related component
      options:
        - Scanner
        - Memory
        - Cheat table
        - Disassembler
        - Debugger
        - WebAssembly rewriter
        - Scripts
        - User interface
        - Other
    validations:
      required: true
